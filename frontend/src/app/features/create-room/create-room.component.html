<div class="page">
  <div class="form-card glass-panel">
    <a routerLink="/" class="back-link">← Volver</a>
    <h2 class="title">Crear partida</h2>
    <p class="subtitle">Configura tu mesa y comparte el código con tus amigos.</p>

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="field">
        <label class="field-label" for="name">Nombre del jugador</label>
        <input
          id="name"
          class="text-input"
          type="text"
          [(ngModel)]="playerName"
          name="playerName"
          maxlength="20"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="field">
        <label class="field-label" for="maxPlayers">Número máximo de jugadores</label>
        <select id="maxPlayers" class="select-input" [(ngModel)]="maxPlayers" name="maxPlayers">
          @for (n of maxPlayerOptions; track n) {
            <option [value]="n">{{ n }} jugadores</option>
          }
        </select>
      </div>

      <div class="field">
        <span class="field-label">Stack inicial</span>
        <div class="preset-row">
          @for (preset of stackPresets; track preset.value) {
            <button
              type="button"
              class="preset-btn"
              [class.active]="startingStack === preset.value"
              (click)="applyPreset(preset)"
            >
              {{ preset.label }}
            </button>
          }
        </div>
      </div>

      <div class="blinds-row">
        <div class="field">
          <label class="field-label" for="sb">Small Blind</label>
          <input id="sb" class="text-input" type="number" [(ngModel)]="smallBlind" name="smallBlind" min="1" required />
        </div>
        <div class="field">
          <label class="field-label" for="bb">Big Blind</label>
          <input id="bb" class="text-input" type="number" [(ngModel)]="bigBlind" name="bigBlind" min="2" required />
        </div>
      </div>

      @if (formError()) {
        <div class="form-error">{{ formError() }}</div>
      }

      <button type="submit" class="btn btn-gold submit-btn" [disabled]="submitting() || !form.valid">
        {{ submitting() ? 'Creando...' : 'Crear sala' }}
      </button>
    </form>
  </div>
</div>
