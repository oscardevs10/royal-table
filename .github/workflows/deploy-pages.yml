name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (static demo - no backend)
        working-directory: frontend
        run: npx ng build --configuration production --base-href /royal-table/

      # GitHub Pages has no server-side rewrites, so deep links (e.g. /room/ABCDE)
      # would 404 on a hard refresh. Serving index.html as the 404 page lets
      # Angular's router take over and resolve the route client-side.
      - name: Add SPA fallback for client-side routing
        run: cp frontend/dist/frontend/browser/index.html frontend/dist/frontend/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
